# 配置示例
target:
  base_url: http://localhost:8000/v1   # 端点地址
  api_key: sk-xxx
  model: qwen2.5-72b-instruct
  # 模型特定约束配置
  constraints:
    disable_temperature_zero_check: false  # 禁用 temperature=0 一致性检查（当模型不支持 temperature=0 时）
    # specified_temperature: 1.0  # 可选的指定 temperature 检查（未配置则跳过；配置后额外执行一次指定温度下的采样验证）
    # 思考控制参数（未配置则跳过 thinking_control 检查）。原样合并进请求体：openai/anthropic 在顶层，gemini 在 generationConfig 内。
    # thinking_enable_params: { thinking: { type: enabled } }
    # thinking_disable_params: { thinking: { type: disabled } }
    # reasoning_efforts: [ max, xhigh, high, medium, low, minimal, none ]  # 模型声称支持的 reasoning_effort 档位（未配置则跳过；仅 openai 协议探测）
    # default_max_tokens: 32768  # 官方标称的 max_tokens 默认值（未配置则跳过 default_max_tokens 探测）
  protocol: openai # openai（默认）/ anthropic / gemini
  timeout: 60s

# Anthropic 原生示例：
# target:
#   base_url: https://api.anthropic.com   # 缺省自动补 /v1
#   api_key: sk-ant-xxx
#   model: claude-sonnet-4-5
#   protocol: anthropic
# Gemini 原生示例：
# target:
#   base_url: https://generativelanguage.googleapis.com   # 缺省自动补 /v1beta
#   api_key: AIza-xxx
#   model: gemini-2.5-flash
#   protocol: gemini

# 可选：裁判模型，用于开放式题目打分（L3 中 scorer 为 judge 的题）
# judge:
#   base_url: https://api.openai.com/v1
#   api_key: sk-yyy
#   model: gpt-4o

layers:
  # L1：任一失败即中止后续评测
  availability:
    enabled: true
  # L2
  protocol:
    enabled: true
  # L3
  capability:
    enabled: true
    # dataset: datasets/smoke.yaml     # 不填则使用内建题库
    concurrency: 4
  # L4
  stability:
    enabled: true
    samples: 5
    soak_requests: 50
    temperature: 1.0
  # L5
  performance:
    enabled: true
    runs: 20
    concurrency: [ 1, 4, 16 ]
    max_probe_tokens: 32768
    slo:
      ttft_p99_ms: 2000
      min_tokens_per_sec: 10
      max_error_rate: 0.01
  # L6：参数边界与健壮性（非法输入应被显式拒绝；通过裸请求绕过 SDK 发送畸形负载）
  boundary:
    enabled: true

thresholds:
  min_layer_score: 0.8    # 层通过线
  fail_fast: false        # 某层不达标即中止（L1 门控不受此开关影响）

output:
  dir: ./reports
  formats: [ json, markdown ]
