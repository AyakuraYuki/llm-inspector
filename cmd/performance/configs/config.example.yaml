# performance 单机压测配置
# 用法：performance -config config.yaml
#
# 全文按「被测对象 → 负载 → 请求内容 → 测量卫生 → 输出」分五段，相互关联的参数放在一起。
# 注释掉的项都是可选项，默认值写在各自说明里；未知字段会直接报错，方便发现拼写问题。

# ============================================================
# 1. 被测服务与模型
# ============================================================

base_url: "https://api.openai.com"   # API 服务地址

# 待测模型（必填，至少一个）。同一模型可重复出现，用不同 token_group 分别测不同渠道。
# token_group 决定该模型从哪个 token 池取 Bearer token；未填时用 default 组（即下方 tokens）。
# 注意：填了 token_group 但该组不存在或为空时直接报错，不会回退到 default 组。
models:
  - name: "gpt-5.6-sol"
    provider: "openai"
    token_group: "openai-channel"
  - name: "claude-sonnet-5"
    provider: "anthropic"
    token_group: "anthropic-channel"

# 命名 token 分组，每组对应 NewAPI 里一组渠道的 Bearer token；同组多个 token 逐请求随机选取。
token_groups:
  openai-channel:
    - "sk-openai-abcdef0123456789"
  anthropic-channel:
    - "sk-anthropic-abcdef0123456789"
    - "sk-anthropic-fedcba9876543210"

# default 组（兼容旧配置）：给没写 token_group 的模型用，可与 token_groups 并存。
#tokens:
#  - "sk-default-abcdef0123456789"

# ============================================================
# 2. 负载：档位与发送方式
# ============================================================

duration: 60s                                         # 每个档位的测试时长（如 60s、2m、1m30s）
concurrency: [10, 20, 30, 40, 50, 75, 100, 120, 150]  # 并发档位，逐档运行

# load_mode：请求怎么发，二选一。
#   closed（默认）—— 每个 worker 等上一个响应回来才发下一个。服务变慢时压测端跟着降速，
#                    结果偏乐观（Coordinated Omission），适合粗看「并发越高慢多少」。
#   open          —— 按 request_rate 的目标 RPS 泊松到达，不等响应。已知线上 QPS、
#                    想验证该流量下扛不扛得住时用它。
#load_mode: "open"
#
# request_rate：仅 open 模式，必填，与 concurrency 等长、逐档配对：
#   request_rate[i] = 第 i 档要维持的每秒请求数，是真正的目标速率
#   concurrency[i]  = 第 i 档同时在途（未收到响应）的请求数上限，防止压测机被撑爆
#   例：QPS 从 5 加到 120 共 6 档，任一时刻最多 200 个在途请求，两个列表都改成 6 项：
#     concurrency:  [200, 200, 200, 200, 200, 200]
#     request_rate: [5,   10,  20,  40,  80,  120]
#request_rate: [5, 10, 20, 40, 80, 120]
#
# open_loop_unbounded：仅 open 模式。true 时不设在途上限、到点即发（evalscope --open-loop 的
# 严格开环），找饱和点更真实；但服务端跟不上时在途请求会在压测机侧无限堆积，
# 开之前先估算压测机的协程/连接/内存承受力。
#open_loop_unbounded: true

# think_time：仅 closed 模式，同一 worker「收到响应」到「发下一个请求」的停顿，默认 300ms。
#   模拟真人节奏         → 保持默认或按场景调大
#   与 evalscope 对拍吞吐 → 显式 0s（完成即发）
# 同样并发下 think_time 越大实际负载越低，改动后新旧报告的 QPS/TPS 不能直接比较。
#think_time: 0s

# requests_per_level：每档请求数上限（evalscope --number）。「发满」与「到达 duration」先到者
# 结束，在途请求照常等完，吞吐分母为实际用时。写一项作用于全部档位，或与 concurrency 等长
# 逐档对应；留空为纯时长制（默认）。
#requests_per_level: [500]

# ============================================================
# 3. 请求内容
# ============================================================

prompt:
  # mode 四选一：
  #   text    —— 固定使用下方 text
  #   dynamic —— 每次请求现场拼装目标长度的随机长文本（长上下文压测），
  #              长度由 tokens 或 tokens_min/tokens_max 决定
  #   codex   —— 类 Codex 系统提示词 + 随机简短提问，模拟高相似度请求
  #   dataset —— 从 dataset_path 随机取一个非空行（evalscope 的 line_by_line）
  mode: "text"
  text: "Explain in plain English what API latency and throughput mean for a developer integrating LLM APIs. Write about 120 words. Do not use bullet points."

  # dynamic 的目标 token 数。配了下方 tokenizer 时精确收敛到该值，
  # 否则按「4 字符 ≈ 1 token」近似（不同词表误差可达 ±30%）
  tokens: 2000
  # dynamic 改为在 [tokens_min, tokens_max] 内逐请求均匀采样（覆盖 tokens）：
  # 真实流量的输入长度是分布不是单点。两项须同时配置且 min <= max。
  #tokens_min: 500
  #tokens_max: 4000

  # dataset 模式必填：纯文本文件，每个非空行一条 prompt
  #dataset_path: "prompts.txt"

# tokenizer：本地分词器（可选），path 指向 configs/tokenizers/<name> 目录
# （HF tokenizer.json 或 tiktoken 格式，纯 Go 加载）。启用后：
#   1. dynamic 模式按词表精确收敛输入长度（对标 evalscope --tokenizer-path）
#   2. 服务端未上报 usage 时用它对可见文本计数，替代字符估算
#   3. usage 对拍：completion_tokens 与本地计数偏差超过 usage_drift_pct（%）的请求打标，
#      能抓出网关/上游 usage 统计不符；思考型请求自动跳过（思考 token 不在可见文本里）
# 词表必须与被测模型一致：仓库预置 deepseek-v4 / glm-53 / kimi-k3，GPT 系可自补 o200k_base；
# Claude/Gemini 词表不公开。目录不可加载时配置阶段直接报错。
#tokenizer:
#  path: "configs/tokenizers/kimi-k3"
#  usage_drift_pct: 10   # 默认 10；显式 0 关闭对拍

# 图片生成端点的 prompt
image_prompt: "A cute fluffy kitten playing with a ball of yarn, soft lighting, adorable, high detail."

# max_output_tokens：各协议输出长度上限的统一取值，默认 8192
# （openai/anthropic 的 max_tokens、gemini 的 maxOutputTokens、responses 的 max_output_tokens）。
# 固定上限才能让 E2E/TPOT/TPS 不混入「模型这次想写多长」的自然波动，跨协议也好比。
#max_output_tokens: 8192

# ============================================================
# 4. 测量卫生：预热、冷却、早停
# ============================================================

warmup: true          # 正式档位前先预热（并发/速率取即将开始的档位），结果丢弃
warmup_duration: 10s  # 每次预热时长
# warmup_per_level：默认只在每个模型的首档前预热一次；true 时每个档位前都预热，
# 挡住档位切换的冷启动批效应，代价是总耗时多「档位数 × warmup_duration」。
#warmup_per_level: true

cooldown: 5s          # 档位之间的冷却等待；0s 表示不等待

# early_stop：某档失败率过高时提前结束该档，并跳过该模型剩余更高档位，默认关闭。
#early_stop:
#  enabled: true
#  max_error_rate: 0.5           # 失败率超过该值判定不可用，(0,1]，默认 0.5
#  min_samples: 20               # 至少凑够这么多请求才评估，避免开局抖动误判，默认 20
#  skip_higher_concurrency: true # 判定不可用后是否跳过该模型剩余更高档位，默认 true

# ============================================================
# 5. 指标与输出
# ============================================================

# slo：goodput 判定阈值（毫秒），只填要考察的维度。开启后终端/Excel 额外展示
# 「同时满足全部已配置阈值的请求占比」。
#slo:
#  ttft_ms: 800
#  tpot_ms: 50
#  e2e_ms: 10000

#show_histogram: true  # 终端/Excel 额外输出 E2E/TTFT 延迟分布直方图

output: ""       # Excel 输出路径，留空自动生成时间戳文件名（如 bench-20260618T150405.xlsx）
no_excel: false  # 跳过 Excel，仅打印终端报告
no_tui: false    # 禁用 TUI，改用纯文本输出（stdout 非终端时自动禁用）

#json_output: "bench.json"  # 结构化 JSON 报告，供 CI 基线比对/画趋势图
#csv_output: "bench.csv"    # 逐档位 CSV 汇总

# sample_output：原始样本 JSONL（一行一条请求，含失败请求）。报表里的分位数是聚合结果，
# 想换口径重算（换分位算法、按时段切窗口、剔除某类样本）时只有原始样本能免于重跑压测。
# 每条成功样本带 ITL 数组，长输出高并发的单档可达几十 MB，按需开启。
#sample_output: "bench-samples.jsonl"
